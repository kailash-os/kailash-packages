# Kailash OS source pins — nvfetcher config (KA-02.3 #68, plan §5.4).
#
# Every bespoke tool's upstream pins here; `nvfetcher -c config.toml
# -o _sources` materialises rev + sha256 into _sources/generated.nix,
# and BOTH files are committed — pins are contract (CONTRIBUTING:
# "source pins change only with the manifest entry they belong to, in
# the same PR"). Research-grade tools pin to commit revs, not tags (R7);
# the census (manifest/categories.yaml) names the tools needing overlay
# currency — the first two seeds ride c-01 (information gathering):
# subfinder and dnsrecon. The update loop is §5.4: update → commit →
# build → PR; CI --dry-run cadence arrives with the milestone automation.
#
# Git sources track the upstream default branch head at pin time; the
# committed _sources/ records the exact rev + SRI hash of record.

[subfinder]
src.git = "https://github.com/projectdiscovery/subfinder"
src.branch = "main"
fetch.git = "https://github.com/projectdiscovery/subfinder"

[dnsrecon]
src.git = "https://github.com/darkoperator/dnsrecon"
src.branch = "master"
fetch.git = "https://github.com/darkoperator/dnsrecon"

# PyRIT — Microsoft's Python Risk Identification Tool for LLMs (KA-11.1 #82):
# the ATTACK layer's LLM red-teaming harness. MIT, commit-pinned from the
# upstream default branch (main) at the newest tip — research-grade pin (R7).
[pyrit]
src.git = "https://github.com/Microsoft/PyRIT"
src.branch = "main"
fetch.git = "https://github.com/Microsoft/PyRIT"

[garak]
# KA-10.1 (kailash-os#80): NVIDIA/garak — LLM vulnerability scanner
# (Shape 1, §5.3). Update-class fast-moving: pinned to the main-branch
# head at pin time; newest-commit check + SRI sha256 verified against
# the GitHub commits API before committing (rev 105164ba = branch tip,
# merge commit of 2026-10-09).
src.git = "https://github.com/NVIDIA/garak"
src.branch = "main"
fetch.git = "https://github.com/NVIDIA/garak"

[art]
# KA-12.1 (kailash-os#84): Trusted-AI/adversarial-robustness-toolbox —
# IBM's ART, the A-5 adversarial-ML research stack (Shape 1, §5.3).
# Update-class steady (§8.5): MIT licence verified against the upstream
# LICENSE at the pin (plan §11.3's "AGPL-class" note is superseded by
# this read — recorded in the manifest entry). Pinned to the exact main
# head at pin time, commit rev not a tag (R7), rev + SRI sha256
# byte-verified against the commits API before committing (rev 4da50bdc
# = main tip, dependabot merge of 2026-10-08).
src.git = "https://github.com/Trusted-AI/adversarial-robustness-toolbox"
src.branch = "main"
src.commit = "4da50bdc5a1393bd33a52f7012f4928dd68fb260"
fetch.git = "https://github.com/Trusted-AI/adversarial-robustness-toolbox"

[counterfit]
# KA-12.2 (kailash-os#85): Azure/counterfit — the counterfit CLI, the
# A-5 model-attack automation layer. REFERENCE POSTURE, pinned frozen:
# upstream is dormant (main tip c00edbf5 = maintainer-list updates of
# 2025-07-18; the repo moved from secureworks/counterfit — 404 there —
# to Azure/counterfit); the census carries it as pinned reference
# (plan §3.3 A-5 / Appendix A). Pinned to the exact main head at pin
# time, commit rev not a tag (R7); rev + SRI sha256 byte-verified
# against the commits API before committing. Freshness is NOT claimed:
# upstream moved last in July 2025 and the pin records that.
src.git = "https://github.com/Azure/counterfit"
src.branch = "main"
src.commit = "c00edbf595303a85a4ce0ac9d8d55d505abf4de5"
fetch.git = "https://github.com/Azure/counterfit"
