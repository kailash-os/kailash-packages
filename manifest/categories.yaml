# Kailash OS category taxonomy — the generated-everything source (KA-04).
#
# Schema (KA-02.2 #67 headers; per-entry fields below). Every later
# artifact (category modules, menu, CLI, docs, site, verifier) generates
# from this file — hand-maintained ONLY here.
#
# Layer names are taxonomy v3 (paper §4.1), as renamed by the BUILD→OPS
# naming umbrella (os#121, mirror kp#9): CLASSIC / ATTACK / DEFENCE /
# OPS over the CORE substrate. The implementation plan v2 letters map:
# A=CLASSIC, B=ATTACK, C=DEFENCE, D=OPS (the plan's v2.1 D- letters of
# the platform layer are born-renamed O- at KA-04.4 per the rename
# record). Entry ids use v3 letters (c-01 … o-07) per the roadmap issues.
#
# Fields per entry:
#   id            v3 slug, unique (validator-enforced at KA-05.1)
#   layer         CLASSIC | ATTACK | DEFENCE | OPS
#   kind          category | data-pack (data-packs are opt-in, never on
#                 default profiles/ISOs — D7; excluded from layer primary
#                 slot counts)
#   name          human name (menu/docs surface)
#   purpose       one-line scope statement
#   coverage      nixpkgs coverage profile (nixpkgs-native majority vs
#                 bespoke-lean) — packaging effort signal
#   tools         primary tool slots (~) from plan §3.6 post-purge census
#   atlas_tactics MITRE ATLAS tactic ids on ATTACK entries (KA-04.2) —
#                 ids from the 2026.05 16-tactic matrix, set validated by
#                 the in-repo manifest gate
#   owasp_llm     OWASP LLM Top 10 class ids per epoch on ATTACK
#                 categories (KA-04.2): "2026" = the 2026 list, v2 = the
#                 v2:2025 list; ids mean different classes per epoch and
#                 are recorded per epoch (§2.4)
#   notes         decisions/constraints worth keeping beside the count
#
# Layer primary-slot totals (§3.6): CLASSIC 141 · ATTACK 59 · DEFENCE 46
# · OPS 91 = ~337 across 31 categories, plus the two opt-in data-packs
# (c-07 sdr-tools here; kailash-data.wordlists-mega rides C-5 as its data
# pack at KA-07.2). One-tool-one-primary-category; spanning tools carry
# secondary tags (validated KA-05.1).
#
# DELIBERATE EXCLUSIONS LEDGER — plan §3.7, recorded in-file (KA-04.4).
# The no-resurrection guard: these classes stay out of every layer's
# census, and the KA-05.1 tool-table purge guard enforces the same
# classes upstream. Each class carries its §3.7 line reference (quoted
# from the §3.7 bullet, the stable locater — v2.2 master).
#
#   - hardware & rf & wifi/bluetooth tooling — §3.7 "Hardware & RF &
#     radio (v2, explicit)": all wifi attack tooling (aircrack-ng suite,
#     airgeddon, wifite, kismet, reaver, bully, pixiewps, hcxdumptool,
#     hcxtools, wifiphisher, fern, asleap, cowpatty, crackle, wifi-honey,
#     wash), bluetooth stacks (ubertooth, bluelog, bluesnarfer,
#     btscanner, blueranger, spooftooph, rfcat, chirp, fang), general
#     hardware-hacking categories (Kali's 14-Hardware Hacking), USB/pcap
#     device tooling, and RF transmission tooling. Sole exception: the
#     c-07 signal & SDR pack — software-only DSP/audio tooling, opt-in
#     data-pack, never on default profiles/ISOs (AI/ML signal work and
#     the a-6 voice-clone research surface).
#
#   - paid-licence tools — §3.7 "Commercial/licensed": Nessus, Cobalt
#     Strike, paid IDA. `kailash doctor <tool>` points at legit
#     licensing.
#
#   - cloud-only SaaS — §3.7 "Cloud-only SaaS": no web-cloud service
#     deliverables in the census; CLI-only deliverables (wandb-cli,
#     O-1) are the recorded exception.
#
#   - unmaintained tools — §3.7 "Unmaintained": truecrack, paros,
#     pre-2015 webshell collections. The same §3.7 bullet set's
#     duplicate-scope rule keeps the maintained one and documents
#     supersession (netexec→crackmapexec precedent; c-4's dropped
#     sqlninja/jsql/sqlsus/tnscmd10g stragglers).
#
#   - network-infrastructure arsenal — §3.7 "Classic-network attack
#     tooling": AD/lateral-movement tooling (impacket suite,
#     mimikatz/rubeus/bloodhound-class), online password brute-forcing
#     against live services, social-engineering tooling, C2 frameworks
#     — Kali-for-networks territory, not the four pillars (§1.2).
#
schema_version: 1

categories:
  # ---- Layer CLASSIC (10 entries: 9 categories + the SDR data-pack) ----
  - id: c-01-information-gathering
    layer: CLASSIC
    kind: category
    name: Information Gathering
    purpose: Classic recon/OSINT lead-in for AI engagements — the AI-surface on-ramp.
    coverage: High
    tools: 38
    notes: classic Kali heritage; KA-06 first-four exemplar module.
  - id: c-02-vulnerability-analysis
    layer: CLASSIC
    kind: category
    name: Vulnerability Analysis
    purpose: Local vulnerability scanning of software artefacts and hosts.
    coverage: Medium
    tools: 7
    notes: GVM/OpenVAS ships as the KA-27 service module, not loose tools.
  - id: c-03-web-application-assessment
    layer: CLASSIC
    kind: category
    name: Web Application Assessment
    purpose: Web/API proxy-based assessment and scanning.
    coverage: Medium-High
    tools: 10
    notes: Burp/ZAP/Caido pinned to exact versions via the lock (KA-07.1).
  - id: c-04-database-assessment
    layer: CLASSIC
    kind: category
    name: Database Assessment
    purpose: Database front-end assessment tooling.
    coverage: High
    tools: 7
    notes: trivially native; KA-06 second-four module.
  - id: c-05-password-offline-credential
    layer: CLASSIC
    kind: category
    name: Password & Offline-Credential Attacks
    purpose: Offline credential attacks (hashes, dumps, artefacts).
    coverage: High
    tools: 15
    notes: online brute-forcing against live services stays OUT (§3.7);
      wordlists ride the opt-in kailash-data.wordlists-mega pack (KA-07.2).
  - id: c-06-reverse-engineering
    layer: CLASSIC
    kind: category
    name: Reverse Engineering (software artefacts)
    purpose: Binary/app artefact RE — software only.
    coverage: Very High
    tools: 26
    notes: no hardware/RF RE per the §3.7 purge.
  - id: c-07-signal-sdr
    layer: CLASSIC
    kind: data-pack
    opt_in: true
    data: kailash-data.sdr-tools
    name: Signal & SDR Processing
    purpose: Software-only signal processing pack for ML signal work (audio/waveform corpora) and the B-6 voice-clone research surface.
    coverage: Medium
    tools: 6
    notes: the sole radio-adjacent concession (§4.1); category of record
      but opt-in data-pack — never on default profiles/ISOs (D7). Module
      stub exists but off everywhere by default; decision + revisit
      condition recorded in the module comment (KA-07.2).
  - id: c-08-exploitation-post-exploitation
    layer: CLASSIC
    kind: category
    name: Exploitation & Post-Exploitation (software)
    purpose: Software-target exploitation, webshells, privesc/post-exploitation.
    coverage: Medium
    tools: 9
    notes: software-only — the AD/lateral-movement/C2 arsenal is excluded
      as doctrine (§4.5); metasploit pinned (KA-07.3).
  - id: c-09-forensics-ir-reporting
    layer: CLASSIC
    kind: category
    name: Forensics, IR & Reporting
    purpose: Artefact forensics, incident response, engagement reporting.
    coverage: Medium-High
    tools: 21
    notes: faraday/timesketch as service modules.
  - id: c-10-runtime-appsec-ai
    layer: CLASSIC
    kind: category
    name: Runtime AppSec for AI Systems
    purpose: AppSec toolkit aimed at AI endpoints — the ASVS-scoped runtime surface (the layer AISVS scopes out).
    coverage: Medium
    tools: 8
    notes: mitmproxy/zap + AI-endpoint DAST (ais primary, llm-fuzzer,
      oauth-mcp-prober, sdl3-stream-fuzzer bespoke entries) per KA-07.4.

  # ---- Layer ATTACK (8 entries, ~59 slots; KA-04.2) ----
  # ATLAS tactic ids verified against the official mitre-atlas/atlas-data
  # dataset (dist/v6/ATLAS-2026.05.yaml + ATLAS-2026.07.yaml): tactic ids
  # and technique placements below cross-checked per epoch — no invented
  # identifiers. OWASP LLM Top 10 class ids per epoch — 2026 list
  # (LLM01 Prompt Injection … LLM10 Improper Output Handling) and v2:2025
  # list (LLM01 Prompt Injection … LLM10 Unbounded Consumption) — same
  # id space, different class mapping per epoch (§2.4); A-3 carries the
  # agentic technique set (ATLAS 2026.07 annex) + AISVS C9/C10 (AISVS 1.0,
  # June 2026) per §4.2 Table 1.
  - id: a-01-ai-recon
    layer: ATTACK
    kind: category
    name: AI Reconnaissance & Target Discovery
    purpose: Discover the AI surfaces a target exposes — models, agents, org artefacts, leaked AI-provider credentials.
    coverage: Very Low
    tools: 5
    atlas_tactics: [AML.TA0002]
    owasp_llm:
      "2026": [LLM02]
      v2: [LLM02, LLM07]
    notes: all bespoke (recon-ai, llm-recon, huggingface-org-scan,
      colab-crawler) plus trufflehog (native; secondary C-8) hunting
      leaked AI-provider keys; the recon stage of the injection class —
      ATLAS Reconnaissance (T0006 Active Scanning, T0004 Search
      Application Repositories, T0064 Gather RAG-Indexed Targets) plus
      Resource Development (T0021 Establish Accounts, T0065 LLM Prompt
      Crafting), tactics recorded at the category level; LLM02 —
      sensitive-info exposure surfaces via exposed artefacts (v2 LLM07
      system-prompt leakage as the discovery prize).
  - id: a-02-prompt-injection-jailbreaks
    layer: ATTACK
    kind: category
    name: LLM Prompt Injection & Jailbreaking
    purpose: Generation-stage prompt attacks — direct/indirect injection, jailbreaks, payload corpora.
    coverage: Low-Medium
    tools: 8
    atlas_tactics: [AML.TA0005, AML.TA0007]
    owasp_llm:
      "2026": [LLM01]
      v2: [LLM01]
    notes: garak/pyrit/promptfoo flagship + inj3ct-llm + the payload/data
      packs; techniques AML.T0051 LLM Prompt Injection (direct/indirect/
      triggered sub-techniques) and AML.T0054 LLM Jailbreak — T0051
      Execution-placed, T0054 Defense Evasion (dataset placements);
      ais is primary-homed in C-10.
  - id: a-03-agentic-mcp-tool-use
    layer: ATTACK
    kind: category
    name: Agentic, MCP & Tool-Use Attacks
    purpose: Attack the agentic control plane — tool-use/MCP scanners, agent fuzzers, poisoned-tool probes.
    coverage: Very Low
    tools: 10
    atlas_tactics: [AML.TA0005, AML.TA0006, AML.TA0008, AML.TA0013, AML.TA0015]
    owasp_llm:
      "2026": [LLM01, LLM03, LLM08, LLM10]
      v2: [LLM01, LLM03, LLM06, LLM08, LLM10]
    aisvs: [C9, C10]
    notes: the novel surface (mcp-inspector, mcp-scan, mcp-guardian,
      mcp-unsafe-deser-probe, langchain-vuln-hunter, llm-agent-fuzzer,
      mcpoison, agent-dojo + packs). Mapped to the ATLAS 2026.07 agentic
      technique set — T0053 AI Agent Tool Invocation, T0103 Deploy AI
      Agent, T0080 AI Agent Context Poisoning, T0110 AI Agent Tool
      Poisoning (executing via T0011.002 Poisoned AI Agent Tool),
      T0098/T0083 agent-credential harvesting, T0084 agent-config
      discovery, T0105 Escape to Host; tactics above read off the
      dataset's per-technique placements (T0053 also T0012/T0015 per
      2026.07); 2026 class LLM03 Excessive Agency is the agentic class
      (v2:2025 holds it at LLM06 — both epochs recorded); aisvs C9
      (Orchestration & Agentic Security) + C10 (MCP Security) per
      AISVS 1.0.
  - id: a-04-model-supply-chain
    layer: ATTACK
    kind: category
    name: Model Supply Chain & Artefact Poisoning
    purpose: Attack the model/artefact supply chain — pickles/weights/registry scanners and artefact inspectors.
    coverage: Very Low
    tools: 8
    atlas_tactics: [AML.TA0004, AML.TA0005]
    owasp_llm:
      "2026": [LLM04]
      v2: [LLM03]
    notes: guarddog/picklescan/modelscan + the artefact inspectors;
      AML.T0010 AI Supply Chain Compromise (Initial Access; the
      artefact-variety parent technique in the 2026 matrix) with
      T0011.001 Malicious Package executing the malicious artefact
      (Execution); LLM04 — the 2026 Supply Chain class (Data and Model
      Poisoning is LLM05:2026); the v2:2025 epoch holds Supply Chain
      at LLM03.
  - id: a-05-model-extraction-inversion
    layer: ATTACK
    kind: category
    name: Model Extraction, Inversion & MIA
    purpose: Model theft and privacy attacks — extraction, inversion, membership inference.
    coverage: Medium
    tools: 8
    atlas_tactics: [AML.TA0000, AML.TA0010]
    owasp_llm:
      "2026": [LLM02]
      v2: [LLM02]
    notes: counterfit (pinned reference), ART/foolbox/cleverhans research
      stack + privacy-meter; techniques T0040/T0041/T0044/T0047 (AI Model
      Access, TA0000) and T0024.002 Extract AI Model / T0057 LLM Data
      Leakage (Exfiltration, TA0010); LLM02 sensitive-information
      disclosure is the epoch-stable class for leakage-by-inference.
  - id: a-06-multimodal-physical-ai
    layer: ATTACK
    kind: category
    name: Multi-modal & Physical-AI Attacks
    purpose: Semantic attacks past the text box — image/voice/camera injection, adversarial visuals; no RF (§3.7).
    coverage: Very Low
    tools: 5
    atlas_tactics: [AML.TA0000, AML.TA0001]
    owasp_llm:
      "2026": [LLM01]
      v2: [LLM01]
    notes: vlm-image-injector, adversarial clothing/patches/camera packs,
      audio-voice-clone-injector (pairs with C-7's software DSP pack);
      techniques T0041 Physical Environment Access (TA0000 AI Model
      Access — the camera/sensor channel), T0043 Craft Adversarial Data
      + T0043.004 Insert Backdoor Trigger (TA0001 AI Attack Staging),
      T0088 Generate Deepfakes (TA0001); cross-modal prompt injection is
      folded into LLM01:2026 by the 2026 preface.
  - id: a-07-ai-system-exploitation
    layer: ATTACK
    kind: category
    name: AI System Exploitation
    purpose: Exploit deployed AI platform services — inference servers, gateways, vector stores (§6.5 pairing thesis).
    coverage: Very Low
    tools: 9
    atlas_tactics: [AML.TA0004, AML.TA0005, AML.TA0010]
    owasp_llm:
      "2026": [LLM02, LLM10]
      v2: [LLM02, LLM10]
    notes: mlflow-bypass, the *-pwn probes, shadow-ray (ATLAS case study
      CS0023 ShadowRay), vector-db-ripper; T0010/T0049 Exploit
      Public-Facing Application (Initial Access, the exposed-service
      class) + T0050 Command and Scripting Interpreter (Execution) +
      T0057 LLM Data Leakage / T0024.002 Extract AI Model (Exfiltration);
      LLM02 — sensitive-data exposure via the misconfigured platform
      (the v2:2025 LLM02 class is Sensitive Information Disclosure, the
      same class).
  - id: a-08-data-poisoning
    layer: ATTACK
    kind: category
    name: Data Poisoning & Dataset Attacks
    purpose: Upstream-of-model attack tooling — dataset poisoning, backdoored training data, split-view replay.
    coverage: Very Low
    tools: 6
    atlas_tactics: [AML.TA0001, AML.TA0006]
    owasp_llm:
      "2026": [LLM05]
      v2: [LLM04]
    notes: poison-dataset-builder, trojai/trojan-lm toolkits,
      prompt-backdoor-tool, data-exfil-via-poison, split-view-replay;
      techniques T0020 Training Data Poisoning (2026.07 dataset
      placement Persistence) and T0018.000 Poison AI Model (staging);
      LLM05 — the 2026 Data and Model Poisoning class (v2:2025 = LLM04).

  # ---- Layer OPS (7 entries, 91 slots; KA-04.4) ----
  # Transcribed from plan §3.6 Table 1 (post-purge census), born OPS per
  # the rename record (os#121 + mirror kp#9): B-1…B-7 → O-1…O-7
  # row-for-row, no scope/count/order change — 91 primary slots as
  # planned. Platform surface, not tactic-mapped: no ATLAS field here
  # (only ATTACK carries tactics per KA-04.2). Excluded classes live in
  # the header's deliberate-exclusions ledger (§3.7) — e.g. cloud-only
  # SaaS stays out, wandb CLI-only is the recorded exception (O-1).
  - id: o-01-mlops-ml-engineering
    layer: OPS
    kind: category
    name: MLOps & ML Engineering Suite
    purpose: ML lifecycle tooling — tracking, data versioning, pipelines, the tabular stack.
    coverage: High
    tools: 18
    notes: mlflow ships as the service module — the pairing-thesis lab
      target (A-7 mlflow-bypass runs against it; lab-default open
      binding documented, never defaulted); dvc, git-lfs, bentoml,
      feast, kedro + kedro-datasets, clearml (module), airflow
      (module), prefect (module), wandb-cli (the CLI-only deliverable
      admitted past the §3.7 cloud-only SaaS exclusion); native
      pandas/polars/scikit-learn/numpy/scipy/xgboost/lightgbm;
      evidently/whylogs shared with D-2 (secondary tags at KA-05).
  - id: o-02-compute-serving-infrastructure
    layer: OPS
    kind: category
    name: Compute & Serving Infrastructure
    purpose: Model serving, orchestration and container runtimes — the deployed-AI platform the attack layers target.
    coverage: Medium
    tools: 13
    notes: vllm, tgi, torchserve, kserve + ray (module);
      triton-inference-server as the docker-wrapper (§5.3 Shape 3 —
      attack-surface tooling is never this shape); ollama, llama.cpp,
      k3s, minikube, kind, podman native (pinned);
      nvidia-container-toolkit native, unfree-class recorded (D4).
  - id: o-03-vector-stores-retrieval
    layer: OPS
    kind: category
    name: Vector Stores & Retrieval
    purpose: Vector databases and retrieval stacks behind RAG surfaces — the A-7 rip targets.
    coverage: Medium
    tools: 9
    notes: chromadb, qdrant, faiss, txtai, jina-embeddings-cli
      native/overlay; weaviate, pgvector, elasticsearch as service
      modules; milvus docker-wrapper.
  - id: o-04-local-llm-inference-labs
    layer: OPS
    kind: category
    name: Local LLM & Inference Labs
    purpose: Local model serving and inference lab UIs — the self-hosted generation surface.
    coverage: Medium-High
    tools: 5
    notes: ollama primary home here (with the documented tiny test
      model for offline smoke tests); llama.cpp, text-generation-webui,
      open-webui, gguf-quantiser. Ollama/llama.cpp also serve O-2 —
      secondary tags at KA-05, never a second primary.
  - id: o-05-ai-engineering-sdks-dev-env
    layer: OPS
    kind: category
    name: AI Engineering SDKs & Dev Environment
    purpose: LLM/agent SDKs, ML frameworks, and the dev environment — the builder layer.
    coverage: Very High
    tools: 26
    notes: langchain, langgraph, llama-index, openai-python,
      anthropic-python, google-genai, autogen, crewai; pytorch (cpu
      default + explicit cuda variant, §5.3 Shape 4 — never a global
      cudaSupport bool), torchvision, torchaudio, tensorflow, jax,
      onnxruntime; transformers, datasets, peft, trl; vscode/
      code-server, neovim, python-lsp-server, uv, ruff, mypy;
      python313 + curated extras. nixvital/ml-pkgs torch/jax-family
      overlay pin is the documented fallback (§5.3).
  - id: o-06-documentation-reporting-authoring
    layer: OPS
    kind: category
    name: Documentation, Reporting & Authoring
    purpose: Engagement-report and docs authoring — the quarto/pandoc/typst pipeline behind generated reports.
    coverage: High
    tools: 12
    notes: quarto, pandoc, typst, mdbook, drawio, excalidraw,
      mermaid-cli, obsidian native; texlive-full rides the opt-in
      kailash-data pack (never on default ISOs, §8.1 budgets) inside
      this count; pwndoc-ng, dradis service modules; faraday secondary
      to C-9.
  - id: o-07-agent-mcp-operability
    layer: OPS
    kind: category
    name: Agent & MCP Operability
    purpose: Operate AI agents inside the distro — the MCP server surface, container/lab packs, capability grants.
    coverage: mixed
    tools: 8
    notes: hexstrike-ai + mcp-kali-server (third-party deliverables,
      exp), malicious-mcp-poc + insecure-mcp-lab (lab packs, exp),
      kailash-mcp (first-party, generated from the manifest),
      kailash-container, headless-agent image, mcp-inspector (the A-3
      tool on dogfood duty). Capability grants (short-lived,
      human-minted) scope agent actions (R11); the CI dogfood loop runs
      the A-3 scanner suite against the distro's own kailash-mcp.
