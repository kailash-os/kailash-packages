# kailash — the manifest-aware CLI (KA-14.1, plan §7.1–7.4).
#
# Packaged as pkgs/kailash (python3Packages.buildPythonApplication over
# ../../cli). pyyaml is declared here for the wheel metadata and in the
# derivation's dependency list the same way the validator check env
# declares it (python3.withPackages (ps: [ ps.pyyaml ])).
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "kailash"
version = "0.1.0"
description = "Kailash OS manifest CLI - list/search/info over the tool manifest"
requires-python = ">=3.9"
dependencies = ["pyyaml"]

[project.scripts]
kailash = "kailash.cli:main"

[tool.setuptools]
packages = ["kailash"]
