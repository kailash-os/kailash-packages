name: flake-check

# The overlay's evaluation + manifest gate on hosted runners (issue #7 /
# KA-02.4). One runner per declared system — nix flake check (current-
# system scope) on each, so both systems evaluate and the
# checks.manifest-wellformed gate builds without cross-arch emulation.
# Grows into the full per-package build matrix at KA-15.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flake-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, system: x86_64-linux }
          - { os: ubuntu-24.04-arm, system: aarch64-linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          # Trust the kailash cache (plan §8.4): the flake's
          # nixConfig.extra-substituters is ignored on hosted runners
          # ("ignoring untrusted flake configuration setting"), so
          # every check run rebuilds tool derivations the cache
          # already holds. Lining it up here makes flake-check pull
          # before it builds.
          extra-conf: |
            extra-substituters = https://kailash.cachix.org
            extra-trusted-public-keys = kailash.cachix.org-1:HnASOtfS7XRjQBrH9umnPljPRjvHeJKDvwZDYXt+sKM=
      - name: Flake check (${{ matrix.system }})
        run: nix flake check
      # Cache push (KA-08.4 stall review, kailash-os#108): flake-check.yml
      # was the one workflow WITHOUT the cachix push block — build.yml
      # pushes (per-leg build legs) but the eval/check job never did, so
      # every cold build this gate performs lands nowhere. The daemon
      # pushes all paths BUILT during the check; the stall-review run's
      # cold rebuilds are exactly what later PRs should pull.
      - name: Cachix (kailash) — push daemon
        uses: cachix/cachix-action@v17
        with:
          name: kailash
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
