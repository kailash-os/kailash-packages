name: build

# KA-15.1 mirror (kailash-os#88, plan §8.3/§8.10): the packages repo runs
# the SAME generator in repo-mode — this repo IS the source of truth for
# the manifest and the pkgs/ tree, so its workflow reads the local copy.
# The OS repo's build.yml is the mirror job: it resolves the pinned rev
# from the OS flake.lock (no floating heads) and runs the byte-identical
# vendored generator against that pin.
#
#   job1 manifest      — self-test + emit the build matrix from the LOCAL
#                        manifest/pkgs/ (repo-mode)
#   job2 build-packages— one nix build leg per matrix entry, on THIS
#                        flake's packages output (the derivations live here)
#
# The vm-tests job is OS-repo-only (the distribution's image/VM gate).
#
# Gate order (plan §8.3): manifest → build-packages → vm-tests →
# images. The packages repo carries the first two jobs; vm-tests and
# images run in the OS repo (kailash-os#88's build.yml holds their
# pipeline positions). build-packages never schedules a leg while the
# manifest gate is red — it needs the manifest job green (and the
# manifest job runs the repo validator itself, so a broken manifest
# bites before the matrix).
#
# Cachix: the `kailash` push step is included COMMENTED below — the
# CACHIX_AUTH_TOKEN secret is not configured yet (verified empty in the
# repo's actions secrets). Uncomment both blocks once the secret lands.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # §8.3 gate order: manifest → packages → vm-tests → images. The
      # manifest job IS the gate that bites: it runs the repo's own
      # validator (tests/validate_manifest.py — the single enforcement
      # point for the §5.2 manifest invariants: unique ids, categories
      # exist, bespoke ⇒ derivation path, ATLAS shape, safety.level,
      # §3.7 no-resurrection, the census reconcile). A broken
      # tools.yaml/categories.yaml fails HERE, before any build leg of
      # the build-packages matrix is scheduled (needs: manifest).
      # KA-15.2 negative-gate evidence recorded on the lane PR.
      - name: Manifest validator (tests/validate_manifest.py)
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 tests/validate_manifest.py
      - name: Generator self-test (the generator gates itself)
        run: python3 tools/manifest-matrix.py --self-test
      - name: Byte-identity check against the OS-repo mirror
        run: |
          # the mirror contract: this copy == the OS copy. While the OS
          # PR is not merged yet (404), the check notes and skips — it
          # enforces strictly once both PRs land on their default
          # branches; drift after that fails this job.
          TMP="$(mktemp)"
          if curl -fsSL -o "$TMP" \
            "https://raw.githubusercontent.com/kailash-os/kailash-os/master/tools/manifest-matrix.py"; then
            cmp tools/manifest-matrix.py "$TMP" \
              || { echo "MIRROR DRIFT: tools/manifest-matrix.py differs from kailash-os@master"; exit 1; }
            echo "mirror identity: byte-identical with kailash-os@master"
          else
            echo "mirror copy not on kailash-os@master yet — identity check pending (enforces after both PRs merge)"
          fi
          # KA-19.1 mirror twin (os#94/#95): the exp-wrap generator rides
          # the same vendored byte-identical pair contract. The OS copy
          # landed via kailash-os#149 — strict from here on.
          TMP2="$(mktemp)"
          if curl -fsSL -o "$TMP2" \
            "https://raw.githubusercontent.com/kailash-os/kailash-os/master/tools/gen-exp-wrap.py"; then
            cmp tools/gen-exp-wrap.py "$TMP2" \
              || { echo "MIRROR DRIFT: tools/gen-exp-wrap.py differs from kailash-os@master"; exit 1; }
            echo "exp-wrap generator mirror identity: byte-identical with kailash-os@master"
          else
            echo "gen-exp-wrap mirror copy not on kailash-os@master yet — pending (enforces after the OS PR merges)"
          fi
      - name: Install PyYAML (matrix parse needs the §5.2 shape)
        run: pip install --disable-pip-version-check pyyaml
      - name: Matrix adapter self-test (the adapter gates itself)
        run: python3 tools/emit-matrix.py --self-test
      - name: Emit build matrix (repo-mode, KA-05.2 adapter)
        id: matrix
        run: |
          # KA-05.2: the tools table is filled (146 CLASSIC rows), so the
          # matrix follows the REAL pkgs/ build surface — the vendored
          # byte-identical generator's repo-mode predates dict rows and
          # its stdlib fallback only parses the header-only shape.
          # tools/emit-matrix.py keeps the generator untouched (mirror
          # contract) and emits the same JSON shape from the filled state.
          OUT="$(python3 tools/emit-matrix.py --manifest-dir manifest)"
          echo "matrix<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Matrix summary
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.matrix.outputs.matrix }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

  build-packages:
    needs: manifest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.manifest.outputs.matrix) }}
    runs-on: ${{ matrix.system == 'x86_64-linux' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          # Trust the kailash cache as a substituter for THIS job. The
          # flake's nixConfig.extra-substituters is IGNORED on hosted
          # runners (run-log proof: "warning: ignoring untrusted flake
          # configuration setting 'extra-substituters'"), so without
          # these lines every leg rebuilds from source. The action must
          # also run BEFORE the build step: its daemon pushes paths via
          # the post-build hook, so ordering it after the build (the
          # old arrangement) started the daemon and shut it down with
          # zero paths pushed (verified in the art aarch64 leg of run
          # 38131821227).
          extra-conf: |
            extra-substituters = https://kailash.cachix.org
            extra-trusted-public-keys = kailash.cachix.org-1:HnASOtfS7XRjQBrH9umnPljPRjvHeJKDvwZDYXt+sKM=
      # --- Cachix (kailash, plan §8.3) — BEFORE the build, not after: ---
      # --- the action registers the substituter (pull side) and the
      # --- daemon pushes every path built during the job (post-build
      # --- hook). Ordering note above is run-log evidence, not style.
      - name: Cachix (kailash) — substituter + push daemon
        uses: cachix/cachix-action@v17
        with:
          name: kailash
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build .#packages.<system>.<package>
        run: |
          nix build ".#packages.${{ matrix.system }}.${{ matrix.package }}" -L 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"
      # --- Wave-2 acceptance smokes (kailash-os#10/#11/#12 — the flagship
      # --- five). The clauses name RECORDED behavioural runs, not just a
      # --- green build: garak --list_probes must print the probe index
      # --- (ko#10); pyrit --version / promptfoo --version smokes (ko#11 —
      # --- pyrit's pin ships pyrit_scan with NO --version flag, so its
      # --- smoke is the import + pinned 1.2.0.dev0 constant; the
      # --- deviation is recorded on the lane PR); ART + counterfit
      # --- import-checks (ko#12). This step runs the per-tool smoke
      # --- against the output THIS leg just built (continue-on-error:
      # --- false — a failed smoke fails the leg). The ko vm-tests job
      # --- re-runs the same script per tool in the OS repo's VM once
      # --- Wave 5's KA-06.3 harness lands (PENDING-VM until then).
      # --- Cachix: the legs PULL from cache.kailash.cachix.org when warm
      # --- (nixConfig.extra-substituters + the push step below), so the
      # --- smoke exercises the cached derivation output, no rebuild.
      - name: Wave-2 acceptance smoke (bespoke five only)
        if: matrix.package == 'garak' || matrix.package == 'pyrit' || matrix.package == 'promptfoo' || matrix.package == 'art' || matrix.package == 'counterfit'
        run: |
          OUT="$(
            nix eval --accept-flake-config --raw \
              ".#packages.${{ matrix.system }}.${{ matrix.package }}.outPath"
          )"
          echo "smoke target: ${{ matrix.package }} @ $OUT"
          # hand the build log over by FILE, never env/argv — the leg logs
          # blow past the exec arg/argv-env ceiling (hosted run
          # 38133352268 job 114452106295: "Argument list too long", 126)
          mv build.log build-smoke.log
          WAVE2_BUILD_LOG_FILE="$PWD/build-smoke.log" \
          python3 tools/wave2-smoke.py \
            --smoke-only --tool "${{ matrix.package }}" --out-path "$OUT" \
            --system "${{ matrix.system }}"
